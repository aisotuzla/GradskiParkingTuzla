<!DOCTYPE html>
<html lang="bs" class="dark">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Tuzla Parking – Pametni Parking - Navigacija</title>

  <meta name="description" content="PWA aplikacija za SMS plaćanje parkinga i offline navigaciju u Tuzli.">

  <meta name="theme-color" content="#050d80">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="blue-translucent">

  <meta name="mobile-web-app-capable" content="yes">

  <link rel="manifest" href="/manifest.json">

</head>

<body class="bg-[#050d80] text-black antialiased overflow-x-hidden selection:bg-[#cc9e06] selection:text-[#FFFFFF]">

  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("/sw.js")
          .then(() => console.log("Service Worker registered"))
          .catch(err => console.error("Service Worker failed:", err));
      });
    }
  </script>

</body>

</html>
